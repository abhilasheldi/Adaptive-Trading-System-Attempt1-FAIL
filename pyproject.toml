[project]
name = "trade-system"
version = "0.1.0"
description = "Systematic crypto trading research system"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pandas-ta",
    "ccxt",
    "yfinance",
    "duckdb",
    "scikit-learn",
    "scipy",
    "xgboost",
    "lightgbm",
    "vectorbt",
    "mlflow",
    "optuna",
    "anthropic",
    "pytest",
    "ruff",
]

dev = [
    "aider-chat"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
