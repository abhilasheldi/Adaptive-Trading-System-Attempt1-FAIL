data_dir: "data/raw"
crypto:
  symbols: ["BTC/USDT", "ETH/USDT"]
  timeframes: ["1h", "4h"]
  outlier_threshold_pct: 10.0
  gap_tolerance_multiplier: 1.5
macro:
  tickers:
    dxy_proxy: "UUP"
    vix: "^VIX"
    spx: "^GSPC"
    qqq: "QQQ"
    btc_dom: "BTC.D"
    us10y: "^TNX"
predictive_core:
  triple_barrier:
    tp_mult: 2.0
    sl_mult: 1.0
    max_candles: 48
  walk_forward:
    train_size: 1000
    val_size: 500
    test_size: 500
    step_size: 500
